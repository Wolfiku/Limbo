<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <style>
        body {
            background: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .error {
            text-align: center;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            font-size: 16px;
            color: #aaa;
            max-width: 420px;
            margin: 0 auto;
        }
        a {
            color: white;
            display: inline-block;
            margin-top: 24px;
            padding: 10px 24px;
            border: 1px solid white;
            text-decoration: none;
            font-size: 14px;
        }
        a:hover { background: white; color: black; }
    </style>
</head>
<body>
    <div class="error">
        <h1>500</h1>
        <p>Auf dem Server ist ein unerwarteter Fehler aufgetreten. Bitte versuche es erneut oder starte das System neu.</p>
        <a href="/">Zur Startseite</a>
    </div>
</body>
</html>
