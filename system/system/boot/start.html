<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start</title>
    <script>
        (async () => {
            // Dynamische Basis-URL (funktioniert auf GitHub Pages und lokal)
            const BASE = window.location.origin + '/' + window.location.pathname.split('/')[1];

            const environmentPath            = BASE + '/system/etc/info/host/environment.info';
            const firstStartupSocketlessPath = BASE + '/system/system/systemapplications/first-startup/localstorage/first-startup.html';
            const firstStartupSocketPath     = BASE + '/system/system/systemapplications/first-startup/socket/first-startup.html';
            const homescreenPath             = BASE + '/system/system/systemapplications/homescreen/homescreen-start.html';
            const socketbootPath             = BASE + '/system/system/boot/Socketboot/boot.js';
            const firstSetupDataPath         = BASE + '/system/data/etc/first-setup.json';
            const errFirstStartup            = BASE + '/system/system/errors/missing-files/boot/first-startup.html';
            const errSocketFirstStartup      = BASE + '/system/system/errors/missing-files/boot/socket-first-startup.html';
            const errBootJs                  = BASE + '/system/system/errors/missing-files/boot/boot.js.html';
            const errEnvironment             = BASE + '/system/system/errors/missing-files/boot/environment.info.html';

            const STORAGE_KEY   = 'first-setup';
            const PERMISSION_KEY = 'persistentStorageAllowed';

            async function fileExists(path) {
                try {
                    const r = await fetch(path, { method: 'HEAD' });
                    return r.ok;
                } catch { return false; }
            }

            async function readJsonFile(path) {
                try {
                    const r = await fetch(path);
                    if (!r.ok) return null;
                    return await r.json();
                } catch { return null; }
            }

            function redirect(path) { window.location.href = path; }

            function isFirstSetupTrue() {
                return localStorage.getItem(STORAGE_KEY) === 'true';
            }

            function hasPersistentStoragePermission() {
                return localStorage.getItem(PERMISSION_KEY) === 'true';
            }

            async function requestPersistentStorage() {
                if (hasPersistentStoragePermission()) return true;
                const granted = confirm('Allow persistent storage?');
                if (granted) {
                    localStorage.setItem(PERMISSION_KEY, 'true');
                    if (navigator.storage && navigator.storage.persist) {
                        await navigator.storage.persist();
                    }
                }
                return granted;
            }

            async function isFirstSetupSocketTrue() {
                const data = await readJsonFile(firstSetupDataPath);
                return data && data['first-setup'] === true;
            }

            async function handleMissingFiles() {
                const envExists    = await fileExists(environmentPath);
                const bootJsExists = await fileExists(socketbootPath);
                if (!envExists)    redirect(errEnvironment);
                else if (!bootJsExists) redirect(errBootJs);
                else               redirect(errFirstStartup);
            }

            try {
                const environment = await readJsonFile(environmentPath);
                if (!environment) { await handleMissingFiles(); return; }

                const { has_socket, one_time } = environment;

                if (has_socket === true) {
                    if (one_time === true) {
                        redirect(homescreenPath);
                    } else {
                        if (!await fileExists(firstStartupSocketPath)) {
                            redirect(errSocketFirstStartup);
                            return;
                        }
                        const done = await isFirstSetupSocketTrue();
                        redirect(done ? homescreenPath : firstStartupSocketPath);
                    }
                } else {
                    if (!hasPersistentStoragePermission()) await requestPersistentStorage();
                    if (!await fileExists(firstStartupSocketlessPath)) {
                        redirect(errFirstStartup);
                        return;
                    }
                    redirect(isFirstSetupTrue() ? homescreenPath : firstStartupSocketlessPath);
                }
            } catch (e) {
                console.error(e);
                await handleMissingFiles();
            }
        })();
    </script>
</head>
<body></body>
</html>
