<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start - System Check</title>
    <script>
        (async () => {
            const STORAGE_KEY = 'first-setup';
            const PERMISSION_KEY = 'persistentStorageAllowed';
            
            // Paths FROM ROOT (korrigiert)
            const environmentPath = '/system/etc/info/host/environment.info';
            const firstStartupPath = '/system/system/systemapplications/first-startup/localstorage/first-startup.html';
            const homescreenPath = '/system/system/systemapplications/homescreen/homescreen-start.html';
            const socketbootPath = '/system/system/boot/Socketboot/boot.js';
            const missingFilesPage1 = '/system/system/errors/missing-files/boot/first-startup.html';
            const missingFilesBootJs = '/system/system/errors/missing-files/boot/boot.js.html';
            const missingFilesEnvironment = '/system/system/errors/missing-files/boot/environment.info.html';
            
            // Helper to check if file exists
            async function fileExists(path) {
                try {
                    const response = await fetch(path, { method: 'GET' });
                    return response.ok;
                } catch {
                    return false;
                }
            }
            
            // Helper to read JSON file
            async function readJsonFile(path) {
                try {
                    const response = await fetch(path);
                    if (!response.ok) return null;
                    return await response.json();
                } catch {
                    return null;
                }
            }
            
            // Check localStorage for first-setup
            function isFirstSetupTrue() {
                return localStorage.getItem(STORAGE_KEY) === 'true';
            }
            
            // Check persistent storage permission
            function hasPersistentStoragePermission() {
                return localStorage.getItem(PERMISSION_KEY) === 'true';
            }
            
            // Request persistent storage permission
            async function requestPersistentStorage() {
                if (hasPersistentStoragePermission()) return true;
                
                const granted = confirm('Persistent Storage erlaubt?');
                
                if (granted) {
                    localStorage.setItem(PERMISSION_KEY, 'true');
                    if (navigator.storage && navigator.storage.persist) {
                        await navigator.storage.persist();
                    }
                }
                return granted;
            }
            
            // Redirect helper
            function redirect(path) {
                window.location.href = path;
            }
            
            // Handle missing files
            async function handleMissingFiles() {
                const envExists = await fileExists(environmentPath);
                const bootJsExists = await fileExists(socketbootPath);
                
                if (!envExists) {
                    redirect(missingFilesEnvironment);
                } else if (!bootJsExists) {
                    redirect(missingFilesBootJs);
                } else {
                    redirect(missingFilesPage1);
                }
            }
            
            // Main logic
            try {
                const environment = await readJsonFile(environmentPath);
                
                if (!environment) {
                    await handleMissingFiles();
                    return;
                }
                
                const { has_socket, one_time, is_admin } = environment;
                
                if (has_socket === true) {
                    if (one_time === true) {
                        redirect(homescreenPath);
                    } else {
                        if (!await fileExists(socketbootPath)) {
                            await handleMissingFiles();
                            return;
                        }
                        await fetch(socketbootPath);
                        redirect(socketbootPath);
                    }
                } else {
                    if (!hasPersistentStoragePermission()) {
                        await requestPersistentStorage();
                    }
                    
                    if (!isFirstSetupTrue()) {
                        redirect(firstStartupPath);
                    } else {
                        redirect(homescreenPath);
                    }
                }
            } catch (error) {
                console.error('Error in start.html:', error);
                await handleMissingFiles();
            }
        })();
    </script>
</head>
<body>
    <p>System wird gestartet...</p>
</body>
</html>
